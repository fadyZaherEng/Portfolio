name: my_portfolio
description: My Portfolio
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get_it: ^7.6.0
  intl: ^0.18.1
  shared_preferences: ^2.2.0
  rxdart: ^0.27.7
  flutter_bloc: ^8.1.3
  flutter_svg: ^2.0.7
  url_launcher: ^6.2.5
  carousel_slider: ^4.2.1
  skeletons: ^0.0.3
  path_provider: ^2.0.15
  path: ^1.8.3
  loading_animation_widget: ^1.2.0+4
  cached_network_image: ^3.3.1
  web: ^0.4.0
  visibility_detector: ^0.4.0+2
  provider: ^6.0.2
  flutter_portal: ^1.1.1
  url_strategy: ^0.2.0
  go_router:
  google_fonts: ^5.0.0
  animated_text_kit:
  hexcolor:
  gif: ^2.3.0
  lottie:
  flutter_animate:
  font_awesome_flutter: ^10.8.0
  universal_html:
  clipboard:
  mailto:
  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  flutter_native_splash: ^2.3.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/gif/
    - assets/images/gif/icons/
    - assets/images/gif/lottie/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: true

flutter_native_splash:
  color: "#000028"
  image: assets/images/fadyy.png
  android_12:
    image: assets/images/fadyy.png
    color: "#000028"
    icon_background_color: "#000028"
  web: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
